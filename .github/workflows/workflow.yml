name: Infra Build Workflow

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Run all environments regardless of detected changes'
        type: boolean
        default: false


permissions:
  id-token: write
  contents: read

jobs:
  # Detect changes in relevant directories
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      vpc-infra: ${{ steps.filter.outputs.vpc-infra }}
      eks-infra: ${{ steps.filter.outputs.eks-infra }}
      scanner-infra: ${{ steps.filter.outputs.scanner-infra }}
      argocd-access: ${{ steps.filter.outputs.argocd-access }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'main' }}
          filters: |
            workflow:
              - '.github/workflows/workflow.yml'
              - '.github/workflows/**/*'
            vpc-infra:
              - 'terraform/vpc-infra/**/*'
            eks-infra:
              - 'terraform/eks-infra/**/*'
            scanner-infra:
              - 'terraform/scanner-infra/**/*'
            argocd-access:
              - 'terraform/argocd-access/**/*'

  # runs on every push and PR, when changes are detected in the relevant directories, or when force_all is true
  vpc_infra_tf_lint_validate:
    needs: changes
    if: |
      needs.changes.outputs.vpc-infra == 'true' ||
      github.event.inputs.force_all == 'true' 
    uses: ./.github/workflows/tf_lint_validate.yml
    with:
      TF_ROOT: terraform/vpc-infra

  # runs on every push and PR, when changes are detected in the relevant directories, or when force_all true
  eks_infra_tf_lint_validate:
    needs: changes
    if: |
      needs.changes.outputs.eks-infra == 'true' ||
      github.event.inputs.force_all == 'true' 
    uses: ./.github/workflows/tf_lint_validate.yml
    with:
      TF_ROOT: terraform/eks-infra

  # Plan-only, visible on every PR
  vpc_plan_pr:
    needs: [changes, vpc_infra_tf_lint_validate]
    if: | 
      needs.changes.outputs.vpc-infra == 'true' &&
      github.event_name == 'pull_request'
    uses: ./.github/workflows/tf_plan_apply.yml
    with:
      TF_ROOT: terraform/vpc-infra
      ENV: staging
      APPLY: false

  eks_plan_pr:
    needs: [changes, eks_infra_tf_lint_validate]
    if: | 
      needs.changes.outputs.eks-infra == 'true' && 
      github.event_name == 'pull_request'
    uses: ./.github/workflows/tf_plan_apply.yml
    with:
      TF_ROOT: terraform/eks-infra
      ENV: staging
      APPLY: false

  # Apply to staging, only once merged to main
  vpc_staging:
    needs: [changes, vpc_infra_tf_lint_validate]
    if: | 
      always() &&
      (needs.changes.outputs.vpc-infra == 'true' || github.event.inputs.force_all == 'true') && 
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 
      github.ref == 'refs/heads/main'  
    uses: ./.github/workflows/tf_plan_apply.yml
    with:
      TF_ROOT: terraform/vpc-infra
      ENV: staging 
      APPLY: true

  eks_staging:
    needs: [changes, eks_infra_tf_lint_validate, vpc_staging]
    if: | 
      always() &&
      (needs.changes.outputs.eks-infra == 'true' || github.event.inputs.force_all == 'true') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 
      github.ref == 'refs/heads/main' && 
      (needs.vpc_staging.result == 'success' || needs.vpc_staging.result == 'skipped')
    uses: ./.github/workflows/tf_plan_apply.yml
    with:
      TF_ROOT: terraform/eks-infra
      ENV: staging 
      APPLY: true

  # Apply to prod, only once staging succeeded on main
  vpc_prod:
    needs: [changes, vpc_staging]
    if: | 
      always() &&
      (needs.changes.outputs.vpc-infra == 'true' || github.event.inputs.force_all == 'true') &&  
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 
      github.ref == 'refs/heads/main' &&
      (needs.vpc_staging.result == 'success' || needs.vpc_staging.result == 'skipped')
    uses: ./.github/workflows/tf_plan_apply.yml
    with:
      TF_ROOT: terraform/vpc-infra
      ENV: prod 
      APPLY: true

  eks_prod:
    needs: [changes, eks_staging, vpc_prod]
    if: |
      always() &&
      (needs.changes.outputs.eks-infra == 'true' || github.event.inputs.force_all == 'true') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.eks_staging.result == 'success' || needs.eks_staging.result == 'skipped') &&
      (needs.vpc_prod.result == 'success' || needs.vpc_prod.result == 'skipped')
    uses: ./.github/workflows/tf_plan_apply.yml
    with:
      TF_ROOT: terraform/eks-infra
      ENV: prod
      APPLY: true

  # scanner-infra is single-environment (prod only, see its providers.tf for
  # why) and independent of the vpc/eks chain above, so it doesn't need a
  # needs: dependency on either.
  scanner_infra_tf_lint_validate:
    needs: changes
    if: |
      needs.changes.outputs.scanner-infra == 'true' ||
      github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/tf_lint_validate.yml
    with:
      TF_ROOT: terraform/scanner-infra
      ENVS: '["prod"]'

  scanner_infra_plan_pr:
    needs: [changes, scanner_infra_tf_lint_validate]
    if: |
      needs.changes.outputs.scanner-infra == 'true' &&
      github.event_name == 'pull_request'
    uses: ./.github/workflows/tf_plan_apply.yml
    secrets: inherit
    with:
      TF_ROOT: terraform/scanner-infra
      ENV: prod
      APPLY: false

  scanner_infra_prod:
    needs: [changes, scanner_infra_tf_lint_validate]
    if: |
      always() &&
      (needs.changes.outputs.scanner-infra == 'true' || github.event.inputs.force_all == 'true') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tf_plan_apply.yml
    secrets: inherit
    with:
      TF_ROOT: terraform/scanner-infra
      ENV: prod
      APPLY: true

  # argocd-access is single-environment (prod only, same rationale as
  # scanner-infra) and Cloudflare-only (no AWS resources), independent of
  # the vpc/eks chain above.
  argocd_access_tf_lint_validate:
    needs: changes
    if: |
      needs.changes.outputs.argocd-access == 'true' ||
      github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/tf_lint_validate.yml
    with:
      TF_ROOT: terraform/argocd-access
      ENVS: '["prod"]'

  argocd_access_plan_pr:
    needs: [changes, argocd_access_tf_lint_validate]
    if: |
      needs.changes.outputs.argocd-access == 'true' &&
      github.event_name == 'pull_request'
    uses: ./.github/workflows/tf_plan_apply.yml
    secrets: inherit
    with:
      TF_ROOT: terraform/argocd-access
      ENV: prod
      APPLY: false

  argocd_access_prod:
    needs: [changes, argocd_access_tf_lint_validate]
    if: |
      always() &&
      (needs.changes.outputs.argocd-access == 'true' || github.event.inputs.force_all == 'true') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tf_plan_apply.yml
    secrets: inherit
    with:
      TF_ROOT: terraform/argocd-access
      ENV: prod
      APPLY: true

  # ArgoCD is installed via CI (not Terraform) chained after the cluster it
  # targets comes up, since a manual install wouldn't survive staging's
  # nightly destroy. Both helm upgrade --install and kubectl apply are
  # idempotent, so re-running this against an already-bootstrapped cluster
  # is a no-op.
  argocd_bootstrap_staging:
    needs: [eks_staging]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.eks_staging.result == 'success' || needs.eks_staging.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: "us-east-1"

      - run: aws eks update-kubeconfig --region us-east-1 --name efi-staging-eks-cluster

      - uses: azure/setup-helm@v4

      - name: Install ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            -f gitops/bootstrap/argocd/values.yml \
            --wait --timeout 5m

      - name: Apply root Application
        run: kubectl apply -f gitops/hub/root/root-app.yaml

  argocd_bootstrap_prod:
    needs: [eks_prod, argocd_access_prod]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.eks_prod.result == 'success' || needs.eks_prod.result == 'skipped') &&
      (needs.argocd_access_prod.result == 'success' || needs.argocd_access_prod.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: "us-east-1"

      - run: aws eks update-kubeconfig --region us-east-1 --name efi-prod-eks-cluster

      - uses: azure/setup-helm@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Install ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            -f gitops/bootstrap/argocd/values.yml \
            --wait --timeout 5m

      # cloudflared (gitops/hub/apps/09-cloudflared) reads its TUNNEL_TOKEN
      # from this Secret. Sourced from argocd-access's already-applied state
      # rather than re-running terraform apply here - argocd_access_prod
      # (a needs: dependency above) owns the actual apply.
      - name: Sync cloudflared tunnel token
        run: |
          cd terraform/argocd-access/environments/prod
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          TOKEN=$(terraform output -raw tunnel_token)
          kubectl create secret generic cloudflared-token -n argocd \
            --from-literal=token="$TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply root Application
        run: kubectl apply -f gitops/hub/root/root-app.yaml

      # Waits for the scanner's Ingress to get an ALB hostname (i.e. for
      # ArgoCD to have actually synced it) and points scan.fetchlabs.io at
      # it - see the script for why this can't be a Terraform resource.
      - name: Sync scan.fetchlabs.io DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: ./scripts/sync-scanner-dns.sh
