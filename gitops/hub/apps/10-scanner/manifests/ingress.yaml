# EKS Auto Mode's built-in ALB controller does NOT use the classic
# kubernetes.io/ingress.class annotation or most alb.ingress.kubernetes.io/*
# annotations - those are silently ignored. AWS-account-level config
# (scheme, cert, listeners, inbound CIDRs, target type) lives in
# IngressClassParams/IngressClass instead (ingressclass.yaml), referenced
# here only via spec.ingressClassName. Confirmed empirically: the classic
# annotation set produced an Ingress with no ADDRESS and no ALB at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fetchlabs-scanner
  namespace: scanner
  annotations:
    # Workload-specific, not AWS-account-level config, so this one still
    # applies per-Ingress rather than moving to IngressClassParams.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: scanner-alb
  rules:
    - host: scan.fetchlabs.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fetchlabs-scanner
                port:
                  name: http
