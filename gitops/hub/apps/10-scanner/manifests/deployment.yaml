apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetchlabs-scanner
  namespace: scanner
  labels:
    app: fetchlabs-scanner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fetchlabs-scanner
  template:
    metadata:
      labels:
        app: fetchlabs-scanner
      # No linkerd.io/inject annotation yet - Linkerd doesn't exist until M3.
      # (Yes, this means our own scanner would currently fail its own
      # FETCHLABS-ZT-002 check. That's fine: M1 doesn't run the scanner
      # against its own manifests, and M3 closes this gap for real.)
    spec:
      containers:
        - name: scanner
          image: scanner:placeholder # replaced by CI via `kustomize edit set image`
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: ALLOWED_ORIGIN
              value: "https://fetchlabs.io"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            # distroless:nonroot sets USER nonroot (a name, not a numeric
            # UID) in the image config. Kubernetes can't verify a named
            # user is non-root without running the image, so runAsNonRoot
            # alone makes it refuse to start (CreateContainerConfigError) -
            # pinning the known UID/GID (65532) directly avoids that check.
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
