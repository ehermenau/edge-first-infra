# AWS-account-level ALB config for EKS Auto Mode's built-in controller.
# Confirmed working against the live cluster: certificateARNs -> a real
# HTTPS:443 listener with our ACM cert, inboundCIDRs -> the ALB's
# auto-created security group actually restricted to these ranges,
# targetType: ip -> pod IPs registered directly in the target group.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: scanner-alb
spec:
  scheme: internet-facing
  targetType: ip
  certificateARNs:
    - arn:aws:acm:us-east-1:624293007511:certificate/9e50a8cb-3a11-454d-a0df-9de738a89295
  listeners:
    - port: 443
      protocol: HTTPS
  # Cloudflare's published ranges (https://www.cloudflare.com/ips-v4 /
  # ips-v6) - refresh periodically. Same list as the removed
  # alb.ingress.kubernetes.io/inbound-cidrs annotation, just relocated to
  # where EKS Auto Mode actually reads it from.
  inboundCIDRs:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: scanner-alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: scanner-alb
