# Stock argo-cd Helm chart values, installed via a CI step (not managed by
# Terraform) chained after eks_staging/eks_prod succeed — see workflow.yml.
# Deliberately minimal for M1: no external Ingress/UI exposure, no custom
# RBAC, no resource limits tuning. Hardening ArgoCD itself is out of scope
# for the walking skeleton; it isn't reachable from outside the cluster.
configs:
  params:
    server.insecure: false

server:
  service:
    type: ClusterIP

  # No K8s Ingress - reached via a Cloudflare Tunnel instead
  # (gitops/hub/apps/09-cloudflared), which talks to this ClusterIP Service
  # directly and puts Cloudflare Access in front as the actual auth
  # boundary. `kubectl port-forward` still works as a fallback.
  ingress:
    enabled: false
